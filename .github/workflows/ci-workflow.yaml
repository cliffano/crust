---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: false
          docker-images: false
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make deps ci'
          image: cliffano/studio:4.0.0
          shell: bash
