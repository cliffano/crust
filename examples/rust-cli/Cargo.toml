[package]
name = "rustcliexample"
version = "0.1.0-pre.0"
edition = "2021"
description = "Rust CLI example project"
authors = ["Cliffano Subagio <blah@cliffano.com>"]
license = "MIT"
repository = "https://github.com/cliffano/crust"
homepage = "https://github.com/cliffano/crust"

[[bin]]
name = "rustcliexample"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
